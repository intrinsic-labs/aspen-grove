# Start a tree from Home's composer with ${MESSAGE} as its first message:
# the tree opens and sends it. Ends on the new tree while the reply streams.
appId: com.intrinsiclabs.aspengrove
---
- tapOn:
    id: home-composer-input
- inputText: ${MESSAGE}
- tapOn:
    id: home-composer-send
- extendedWaitUntil:
    visible:
      id: chat-screen
    timeout: 10000
