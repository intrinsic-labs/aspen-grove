# Import ${TREE_FILE} from Files ("On My iPhone"), starting on Home.
# Prints `PERF import_ms`, from picking the file to the "Import complete"
# alert. Ends on Home, with the tree in its list.
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-home-menu.yaml
- tapOn: Import OpenLoom Tree
- tapOn: Browse
- waitForAnimationToEnd
# The picker reopens where it was last left: from the Browse root, step into
# "On My iPhone".
- tapOn:
    text: 'On My iPhone'
    optional: true
- waitForAnimationToEnd
- evalScript: ${output.t0 = Date.now()}
- tapOn: '${TREE_FILE}, openloom.*'
- extendedWaitUntil:
    visible: 'Import complete'
    timeout: 180000
- evalScript: ${console.log('PERF import_ms=' + (Date.now() - output.t0))}
- tapOn: OK
