# Import ${TREE_FILE} from Files ("On My iPhone"), from any top-level screen.
# Prints `PERF import_ms`, from picking the file to the "Import complete"
# alert. Ends on the Loom Trees screen.
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-drawer.yaml
- tapOn:
    id: drawer-nav-trees
- tapOn:
    id: trees-menu-button
- tapOn: Import Tree
- tapOn: Browse
- waitForAnimationToEnd
# The picker reopens where it was last left: from the Browse root, step into
# "On My iPhone".
- tapOn:
    text: 'On My iPhone'
    optional: true
- waitForAnimationToEnd
- evalScript: ${output.t0 = Date.now()}
- tapOn: '${TREE_FILE}, openloom.*'
- extendedWaitUntil:
    visible: 'Import complete'
    timeout: 180000
- evalScript: ${console.log('PERF import_ms=' + (Date.now() - output.t0))}
- tapOn: OK
