# One timed open of the first tree in Home's list: tap the row, wait for the
# first message row. Starts and ends on Home.
appId: com.intrinsiclabs.aspengrove
---
- waitForAnimationToEnd
- evalScript: ${output.t0 = Date.now()}
- tapOn:
    id: home-trees-row-.*
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
    timeout: 60000
- evalScript: ${console.log('PERF open_tree_ms=' + (Date.now() - output.t0))}
- waitForAnimationToEnd
- runFlow: ../go-home.yaml
