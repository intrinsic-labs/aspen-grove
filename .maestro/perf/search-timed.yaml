# (d) Search every tree for a common word, ${SEARCH_TERM}. In the fake seed,
# about 260 of 520 nodes hold "lantern", the default (the repository caps
# results at 100); the real-text tree needs another word ("skeptic"). Timed
# from starting to type to the first result row, so it includes Maestro's
# typing and the 250 ms debounce: compare against the same search on the tiny
# tree (perf-floor.yaml).
appId: com.intrinsiclabs.aspengrove
env:
  SEARCH_TERM: ${SEARCH_TERM || 'lantern'}
---
- runFlow: ../open-home-menu.yaml
- tapOn: Search
- tapOn:
    id: search-input
- waitForAnimationToEnd
- evalScript: ${output.t0 = Date.now()}
- inputText: ${SEARCH_TERM}
- extendedWaitUntil:
    visible:
      id: 'search-results-row-.*'
    timeout: 30000
- evalScript: ${console.log('PERF search_ms=' + (Date.now() - output.t0))}
