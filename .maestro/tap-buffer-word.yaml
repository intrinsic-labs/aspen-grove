# Puts the caret on the edited word (the first model passage's word), where the
# version pill shows: iOS keeps the caret across a switch, so nothing to do
# there. Android's web editor resets it to the text's end on a switch.
appId: com.intrinsiclabs.aspengrove
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: '12%,21%'
      - runFlow: nudge-buffer-caret.yaml
