# The buffer editor's developer preview, no key and no mock server: Home's
# menu → New Buffer → type → the review sample → a word typed into model text
# → back out and reopen from Recents.
# -e ENGINE_TAPS=1 (Android) runs it on the CodeMirror WebView engine.
# Needs a build whose Metro bundle was made with EXPO_PUBLIC_BUFFER_PREVIEW=1:
#   EXPO_PUBLIC_BUFFER_PREVIEW=1 npx expo start --dev-client --port 8081
#   maestro --device "$DEVICE" test .maestro/buffer-editor-preview.yaml --test-output-dir "$SHOTS"
# Screenshots are named for what they show.
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-app.yaml
- runFlow: skip-onboarding.yaml

# Home's menu offers New Buffer.
- runFlow: open-home-menu.yaml
- assertVisible: 'New Buffer'
- takeScreenshot: 00a-home-menu
- tapOn: 'New Buffer'
- extendedWaitUntil:
    visible:
      id: buffer-screen
    timeout: 15000
- repeat:
    times: ${ENGINE_TAPS || 0}
    commands:
      - tapOn:
          id: buffer-engine

# An empty buffer takes typing, keyboard up.
- tapOn:
    id: buffer-document
- inputText: 'The kettle was already warm when I came down.'
- waitForAnimationToEnd
- takeScreenshot: 00b-empty-buffer
- assertVisible: 'The kettle was already warm.*'

# Back out and start a second buffer for the sample: an empty buffer opens
# with the keyboard down, and nothing on this screen puts the keyboard away.
# The keyboard is up, so hideKeyboard only closes it (on Android it is the
# back key); going back then leaves the screen.
- hideKeyboard
- waitForAnimationToEnd
- assertVisible:
    id: buffer-screen
- runFlow: go-back.yaml
- extendedWaitUntil:
    visible:
      id: home-welcome
    timeout: 10000
- runFlow: open-home-menu.yaml
- tapOn: 'New Buffer'
- extendedWaitUntil:
    visible:
      id: buffer-screen
    timeout: 15000
- repeat:
    times: ${ENGINE_TAPS || 0}
    commands:
      - tapOn:
          id: buffer-engine
- assertVisible:
    id: buffer-load-sample
- tapOn:
    id: buffer-load-sample
- assertVisible:
    id: buffer-branch-control
- assertVisible: 'Branch 1 of 2'
- waitForAnimationToEnd

# Keyboard down: the pill floats centered above the bottom safe area.
- assertVisible:
    id: buffer-branch-control
- takeScreenshot: 01-sample-pill

# The second sibling has a different ending.
- tapOn:
    id: buffer-branch-next
- assertVisible: 'Branch 2 of 2'
- waitForAnimationToEnd
- takeScreenshot: 02-branch-2

# Back to the first, then into the opening's last word: the keyboard comes up
# and the pill rides above it.
- tapOn:
    id: buffer-branch-prev
- assertVisible: 'Branch 1 of 2'
# iOS snaps a tap to the nearest word edge; Android puts the caret at the
# exact character, so it is aimed at the end of "falling" (1080x2424 px).
# The iOS point is relative to the screen, not the input: on iOS the input's
# frame starts below the header, so a point relative to it lands lower.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: '55%,17%'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: buffer-document
          point: '56%,15%'
- waitForAnimationToEnd
- assertVisible:
    id: buffer-branch-control
- takeScreenshot: 03-keyboard-up

# Type a word into the model's text: it reads as the human's, and the
# surrounding spaces stay single.
- inputText: ' softly'
- waitForAnimationToEnd
# The web engine's accessibility text can lag behind typing, and its caret
# lands a character later, so there the receipt is read instead: the sample's
# 156 characters plus the 7 typed.
- runFlow:
    when:
      true: ${ENGINE_TAPS == '1'}
    commands:
      - assertVisible:
          id: buffer-doc-stats
          text: 'len=163 head=.*'
- runFlow:
    when:
      true: ${ENGINE_TAPS != '1'}
    commands:
      - assertVisible:
          id: buffer-document
          text: '.*falling softly since dawn\..*'
- takeScreenshot: 04-typed-into-model-text

# Fill the document so its last line has to clear the pill.
- repeat:
    times: 4
    commands:
      - inputText: ' The lamps burned low and the harbour kept its own counsel.'
- waitForAnimationToEnd
- assertVisible:
    id: buffer-branch-control
- takeScreenshot: 05-long-text-clearance

# Back out and reopen the buffer from Recents.
# The keyboard is up, so hideKeyboard only closes it (on Android it is the back key).
- hideKeyboard
- waitForAnimationToEnd
- assertVisible:
    id: buffer-screen
- runFlow: go-back.yaml
- extendedWaitUntil:
    visible:
      id: home-welcome
    timeout: 10000
- assertVisible: 'Untitled Buffer.*'
- tapOn: 'Untitled Buffer.*'
- extendedWaitUntil:
    visible:
      id: buffer-screen
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 06-reopen
