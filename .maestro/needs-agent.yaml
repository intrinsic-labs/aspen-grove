# A tree imported before any agent exists opens, reads normally and asks for
# an agent; once one exists, the tree adopts it. Copy
# .maestro/perf/fixtures/perf-tiny.openloom into the simulator's Files
# ("On My iPhone") first. No key needed: nothing is sent.
#   maestro test .maestro/needs-agent.yaml --test-output-dir "$SHOTS"
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-app.yaml
- runFlow: skip-onboarding.yaml
- runFlow:
    file: import-tree.yaml
    env:
      TREE_FILE: perf-tiny.openloom

# Opens with its messages and, in place of the input, the notice.
- tapOn:
    id: home-trees-row-.*
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
    timeout: 30000
- assertVisible: 'The lantern is lit.'
- assertVisible:
    id: chat-needs-agent
- assertNotVisible:
    id: chat-composer-input
- takeScreenshot: 21-needs-agent

# The notice's button pushes the tree's Model Settings, which asks for a model.
- tapOn:
    id: chat-needs-agent-choose
- extendedWaitUntil:
    visible:
      id: tree-model-screen
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'Choose a model for this tree.'
- takeScreenshot: 22-needs-agent-settings
- repeat:
    times: 3
    while:
      notVisible:
        id: chat-needs-agent
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd

# Create an agent elsewhere; back on the tree, it has adopted it.
- runFlow: go-home.yaml
- runFlow: create-agent.yaml
- runFlow: go-home.yaml
- tapOn:
    id: home-trees-row-.*
- extendedWaitUntil:
    visible:
      id: chat-composer-input
    timeout: 30000
- assertNotVisible:
    id: chat-needs-agent
- takeScreenshot: 23-agent-adopted
