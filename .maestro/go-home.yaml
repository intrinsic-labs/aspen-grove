# Back to Home from any pushed screen (Settings, Search, a tree): go back
# (go-back.yaml) until Home shows, since a tap mid-transition can be dropped.
appId: com.intrinsiclabs.aspengrove
---
- repeat:
    times: 4
    while:
      notVisible:
        id: home-welcome
    commands:
      - waitForAnimationToEnd
      - runFlow: go-back.yaml
- assertVisible:
    id: home-welcome
