# Back to Home from any pushed screen (Settings, Search, a tree): tap the
# stack header's back button until Home shows (`back` is Android-only in
# Maestro, and a tap mid-transition can be dropped).
appId: com.intrinsiclabs.aspengrove
---
- repeat:
    times: 4
    while:
      notVisible:
        id: home-welcome
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: BackButton
- assertVisible:
    id: home-welcome
