# A long-press on a reply taller than the screen: the lifted preview is
# cropped at full size below the tree's header, its top showing and its cut
# fading out, with the whole menu under it (iOS). Then the composer's
# bottom: with the reply's text running on under the composer, none of it
# may show below the composer's field, with the keyboard down or up.
# Needs Metro and the mock server started with long replies:
#   node scripts/mock-llm-server/cli.ts --port 1235 --pace 200 --words 600
#   maestro test .maestro/mock/tall-reply-menu.yaml --test-output-dir "$SHOTS/tall-reply-menu"
appId: com.intrinsiclabs.aspengrove
---
- runFlow: setup.yaml
- runFlow: ../go-home.yaml
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Tell me everything about aspen clones.
# The reply fills the screen (the question scrolls out of view), so wait for
# its title rather than its row.
- extendedWaitUntil:
    visible: 'Mock title #\d+'
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: chat-streaming-message
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: tall-01-reply

# The menu's first and last items both show, under the cropped preview. The
# row's own center is off screen; the screen's middle is the reply's text.
- longPressOn:
    point: '50%,50%'
- assertVisible: 'Regenerate Response'
- assertVisible: 'Prune'
- takeScreenshot: tall-02-reply-menu
- tapOn:
    point: '50%,12%'
- waitForAnimationToEnd
- assertNotVisible: 'Regenerate Response'
- takeScreenshot: tall-03-dismissed

# The reply's text runs on under the composer, mid-reply: the band under
# the composer's field hides it down to the screen's edge.
- swipe:
    start: 50%, 40%
    end: 50%, 55%
    duration: 800
- waitForAnimationToEnd
- assertVisible:
    id: chat-composer-bottom-band
- takeScreenshot: tall-04-composer-bottom
# With the keyboard up, nothing shows between the field and the keyboard.
- tapOn:
    id: chat-composer-input
# The simulator may not raise its keyboard for a focus alone: typing does.
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: x
      - eraseText: 1
      - extendedWaitUntil:
          visible:
            id: space
          timeout: 10000
- waitForAnimationToEnd
- assertVisible:
    id: chat-composer-bottom-band
- takeScreenshot: tall-05-composer-bottom-keyboard
