# Cold start (cleared data) wired to the mock server: open the app, connect
# LM Studio to the mock and create an agent on it. Ends on Settings.
#   maestro test .maestro/mock/setup.yaml --test-output-dir "$SHOTS"
appId: com.intrinsiclabs.aspengrove
---
- runFlow: ../open-app.yaml
- runFlow:
    file: connect-mock.yaml
    env:
      MOCK_URL: http://localhost:1235
      MOCK_MODEL: mock-model
