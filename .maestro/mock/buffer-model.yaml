# The buffer's base-model browser, against the mock LM Studio connection.
# setup.yaml configures and tests LM Studio at MOCK_URL on both platforms;
# the imported buffer fixture supplies a stable buffer tree with no model.
# Stage buffer-versions.openloom as described by buffer-edit.yaml, then run:
#   maestro test -e MOCK_URL=http://localhost:1235 .maestro/mock/buffer-model.yaml
appId: com.intrinsiclabs.aspengrove
env:
  MOCK_URL: ${MOCK_URL || 'http://localhost:1235'}
  TREE_FILE: buffer-versions.openloom
---
- runFlow: setup.yaml
- runFlow: ../go-home.yaml
- runFlow: ../import-buffer-fixture.yaml
- tapOn: 'Buffer versions sample.*'
- extendedWaitUntil:
    visible:
      id: buffer-screen
    timeout: 15000

# The first tap after the buffer opens can be lost (iOS), so tap until the
# screen shows.
- waitForAnimationToEnd
- repeat:
    times: 4
    while:
      notVisible:
        id: buffer-model-screen
    commands:
      - tapOn:
          id: buffer-model-button
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: buffer-model-screen
    timeout: 10000
- tapOn:
    id: buffer-model-provider-lmstudio
- extendedWaitUntil:
    visible:
      id: buffer-model-option-mock-base
    timeout: 10000
- assertVisible: 'Writing fixture \(base\)'
- assertNotVisible:
    id: buffer-model-option-mock-model
- tapOn:
    id: buffer-model-option-mock-base
- extendedWaitUntil:
    visible:
      id: buffer-model-button
      # The button's accessibility label is "Model, <name>", so match the tail.
      text: '.*Writing fixture \(base\)'
    timeout: 10000
