# Several continuations at once, against the mock server (no key): a turn,
# its rail, N picked (up to 4, then 3), Generate 3; the cards stream side by
# side, one fails on its own (a plain line, its raw error one tap away) while
# the other two finish and are saved; the rail scrolled to its end shows the
# last card whole; one
# is expanded (its provenance verified) and made current from its menu; then a relaunch shows the choice and
# both siblings kept.
# Needs Metro and the mock server started so that one stream of each
# overlapping burst fails, slowly enough to catch the cards mid-stream:
#   node scripts/mock-llm-server/cli.ts --port 1235 --pace 3 --fail-in-burst 2 --fail-status 422
# On Android use --pace 1.5: Maestro's steps there wait out the streaming
# text, and a 20 s stream ends before the flow has swiped back to the first
# card (40 s stays under the app's 60 s limit on an LM Studio stream).
#   maestro test .maestro/mock/parallel-continuations.yaml --test-output-dir "$SHOTS/parallel-continuations"
# The mock's log shows the three requests open at once (burst=1..3, active=3).
appId: com.intrinsiclabs.aspengrove
---
- runFlow: setup.yaml
- runFlow: ../go-home.yaml
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Tell me about aspen groves.
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
# Auto-Title's call comes after the reply; let it finish so the run below is
# the only traffic on the mock (a 40 s reply at --pace 1.5, then the title).
- extendedWaitUntil:
    visible: 'Mock title #\d+'
    timeout: 90000
- waitForAnimationToEnd

# The human turn's rail: its one continuation so far, and the generate row.
- tapOn:
    id: chat-message-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: chat-continuation-generate-button
    timeout: 15000
- waitForAnimationToEnd

# Pick N: up to the most (4, where + stops), then back down to 3.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: chat-continuation-count-increase
- assertVisible:
    id: chat-continuation-count-value
    text: '4'
- tapOn:
    id: chat-continuation-count-increase
- assertVisible:
    id: chat-continuation-count-value
    text: '4'
- tapOn:
    id: chat-continuation-count-decrease
- assertVisible:
    id: chat-continuation-count-value
    text: '3'
# The button's accessibility label (what Maestro reads) spells out its title.
- assertVisible: 'Generate 3 continuations'
- takeScreenshot: par-01-pick-n

# Generate 3: every card streams at once, in its own card. The rail scrolls
# to its end, the last card. The mock fails the second request of the burst,
# which is slot 1's (the slots' requests go out in slot order).
- tapOn:
    id: chat-continuation-generate-button
- extendedWaitUntil:
    visible:
      id: chat-continuation-stop-all
    timeout: 10000
# The row follows the run to its end: the last slot's card is on screen.
- extendedWaitUntil:
    visible:
      id: chat-continuation-slot-2
    timeout: 15000
- takeScreenshot: par-02-streaming

# Which card fails is the order the three requests reach the mock: the
# second (slot 1 on iOS; any slot on Android, whose requests can arrive in
# any order). So the steps below find cards by state, not by slot.
# The failed card says so while the others keep going.
- runFlow:
    file: ../rail-find.yaml
    env:
      TARGET: 'chat-continuation-slot-error-.*'
- takeScreenshot: par-03a-one-failed
- runFlow:
    file: ../rail-find.yaml
    env:
      TARGET: 'chat-continuation-slot-state-.*-streaming'
- takeScreenshot: par-03b-others-streaming

# Both survivors finish and are saved; the failed one stays failed.
- extendedWaitUntil:
    notVisible:
      id: chat-continuation-stop-all
    timeout: 60000
- runFlow:
    file: ../rail-find.yaml
    env:
      TARGET: 'chat-continuation-slot-state-.*-done'
- takeScreenshot: par-04-result

# The failed card reads plainly; the raw error waits behind a tap.
- runFlow:
    file: ../rail-find.yaml
    env:
      TARGET: 'chat-continuation-slot-state-.*-failed'
- assertVisible:
    id: 'chat-continuation-slot-error-.*'
    text: 'LM Studio returned an error.'
# iOS reads the card as one button: the line, then "Tap for details."
- assertVisible:
    id: 'chat-continuation-slot-error-toggle-.*'
    text: '.*Tap for details\.'
- assertNotVisible:
    id: 'chat-continuation-slot-error-detail-.*'
- takeScreenshot: par-04a-failed-collapsed
- tapOn:
    id: 'chat-continuation-slot-error-toggle-.*'
- assertVisible:
    id: 'chat-continuation-slot-error-detail-.*'
    text: '\[lmstudio:.*'
- takeScreenshot: par-04b-failed-expanded
- tapOn:
    id: 'chat-continuation-slot-error-toggle-.*'
- assertNotVisible:
    id: 'chat-continuation-slot-error-detail-.*'

# Scrolled to its end, the rail shows the last card whole, with the same
# margin after it as before the first. Long swipes from the right edge: a
# short one from the rail's middle can stop short of the end.
- swipe:
    start: 92%, 30%
    end: 8%, 30%
- waitForAnimationToEnd
- swipe:
    start: 92%, 30%
    end: 8%, 30%
- waitForAnimationToEnd
- assertVisible:
    id: chat-continuation-slot-2
- takeScreenshot: par-04c-rail-end

# Choose one: the first saved card on screen at the rail's end, where every
# card is the run's (slot 2's, or slot 1's when slot 2 failed). iOS lists
# only on-screen elements, and flattens the card out of its slot, so it is
# picked by id alone. Remember its reply number so the chat (and the
# relaunch) can be checked against it.
- copyTextFrom:
    id: 'chat-continuation-card-.*'
- runScript: remember-reply-number.js
# A tap expands it: the saved node with its own raw response, verified.
- tapOn:
    id: 'chat-continuation-card-.*'
- extendedWaitUntil:
    visible:
      id: node-sheet
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'Verified.*'
- takeScreenshot: par-05-saved-card-provenance
- tapOn:
    id: node-sheet-back
- extendedWaitUntil:
    notVisible:
      id: node-sheet
    timeout: 10000
- waitForAnimationToEnd
# Make it current from its menu. (A double tap does the same, but Maestro's
# two taps on iOS land further apart than the app's 300 ms double-tap window.)
- longPressOn:
    id: 'chat-continuation-card-.*'
- tapOn: 'Make Current Node'
- extendedWaitUntil:
    notVisible:
      id: chat-continuation-rail
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: '${output.chosen}\.[\s\S]*'
- takeScreenshot: par-06-chosen-current

# Restart: the chosen card is still the current path, and the rail still
# holds the first reply and both saved siblings, the chosen one checked.
- runFlow: ../relaunch-app.yaml
- tapOn:
    id: home-trees-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 15000
- waitForAnimationToEnd
- assertVisible: '${output.chosen}\.[\s\S]*'
- tapOn:
    id: chat-message-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: 'chat-continuation-card-.*'
    timeout: 15000
- waitForAnimationToEnd
# Three cards: the first reply and the two saved siblings. The check (the
# card the active path runs through) is on the chosen one.
- assertVisible: 'Continuations: 3'
- takeScreenshot: par-07-after-relaunch
- repeat:
    times: 4
    while:
      notVisible:
        id: chat-continuation-card-check
    commands:
      - swipe:
          from:
            id: chat-continuation-rail-list
          direction: LEFT
      - waitForAnimationToEnd
- assertVisible:
    id: chat-continuation-card-check
- assertVisible: '${output.chosen}\.[\s\S]*'
- takeScreenshot: par-08-after-relaunch-chosen-checked
