# LM Studio unreachable in a tree: after beta1-empty-states.yaml, with the
# mock server stopped, a send in the tree on the mock agent fails with a
# plain message naming the saved address and a way to Connections. Keeps
# the app's data.
#   (stop the mock) maestro test .maestro/mock/beta1-lmstudio-down.yaml --test-output-dir "$SHOTS/beta1-lmstudio-down"
# Set up on another port? Pass the same -e MOCK_URL=http://localhost:<port>.
appId: com.intrinsiclabs.aspengrove
env:
  MOCK_URL: ${MOCK_URL || 'http://localhost:1235'}
---
- runFlow: ../relaunch-app.yaml
- tapOn:
    id: home-trees-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: chat-composer-input
- inputText: Are you there?
- tapOn:
    id: chat-composer-send
- extendedWaitUntil:
    visible:
      id: chat-error
    timeout: 60000
# The address sits on a line of its own.
- assertVisible: "(?s)LM Studio isn't answering at this address:\\n${MOCK_URL}\\n.*"
- runFlow: ../dismiss-keyboard.yaml
- takeScreenshot: es-08-chat-lmstudio-unreachable
- tapOn:
    id: chat-error-action
# The Connections sheet opens on its list; LM Studio's row leads to its server.
- extendedWaitUntil:
    visible:
      id: connections-row-lmstudio
    timeout: 10000
- tapOn:
    id: connections-row-lmstudio
- extendedWaitUntil:
    visible:
      id: connections-provider-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: connections-lmstudio-test
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: es-09-unreachable-opens-connections
