# Beta 1's empty states, each saying what to do next, on a cleared install
# against the mock server (no key): no agent, a send with no agent (opens
# onboarding's setup page, not an error, and the message waits in the first
# tree's composer), LM Studio unreachable during setup,
# no trees once a model is set up, and no OpenRouter key. Ends on Home with
# one tree on the mock agent; beta1-lmstudio-down.yaml goes on from there.
# Needs the mock server and Metro up (see VERIFY.md, "No key?"):
#   maestro test .maestro/mock/beta1-empty-states.yaml --test-output-dir "$SHOTS/beta1-empty-states"
appId: com.intrinsiclabs.aspengrove
env:
  MOCK_URL: ${MOCK_URL || 'http://localhost:1235'}
  DEAD_URL: ${DEAD_URL || 'http://localhost:1299'}
  MOCK_MODEL: mock-model
---
- runFlow: ../open-app.yaml
- runFlow: ../skip-onboarding.yaml

# No agent and no trees: Home's hint says to set up a model.
- extendedWaitUntil:
    visible:
      id: home-setup-hint
    timeout: 10000
- assertVisible: 'Choose a model to start your first tree.'
- tapOn:
    id: home-greeting
- waitForAnimationToEnd
- takeScreenshot: es-01-home-no-agent

# A first message with no agent opens onboarding's setup page, no error.
- tapOn:
    id: home-composer-input
- inputText: Hello, loom.
- tapOn:
    id: home-composer-send
- extendedWaitUntil:
    visible:
      id: onboarding-step-setup
    timeout: 10000
- waitForAnimationToEnd
- assertNotVisible:
    id: home-error
- takeScreenshot: es-02-send-without-agent-opens-setup

# LM Studio unreachable while setting up: the page says so.
- tapOn:
    id: onboarding-provider-lmstudio
- waitForAnimationToEnd
- tapOn:
    id: connections-lmstudio-endpoint-input
- longPressOn:
    id: connections-lmstudio-endpoint-input
- tapOn:
    text: 'Select All'
    optional: true
- eraseText: 80
- inputText: ${DEAD_URL}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: connections-lmstudio-test
- extendedWaitUntil:
    visible:
      id: connections-lmstudio-error
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: es-03-setup-lmstudio-unreachable

# The mock instead: Connected, a model, Begin Weaving opens a first tree.
- tapOn:
    id: connections-lmstudio-endpoint-input
- longPressOn:
    id: connections-lmstudio-endpoint-input
- tapOn:
    text: 'Select All'
    optional: true
- eraseText: 80
- inputText: ${MOCK_URL}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: connections-lmstudio-test
- extendedWaitUntil:
    visible:
      id: connections-lmstudio-status
      text: 'Connected'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: onboarding-lmstudio-model-${MOCK_MODEL}
    timeout: 10000
- tapOn:
    id: onboarding-lmstudio-model-${MOCK_MODEL}
- waitForAnimationToEnd
- tapOn:
    id: onboarding-begin
- extendedWaitUntil:
    visible:
      id: tree-onboarding-begin
    timeout: 15000
- runFlow: ../dismiss-tree-onboarding.yaml
- assertVisible:
    id: chat-screen
- assertNotVisible:
    id: chat-error
# The message typed before setup waits, unsent, in the first tree's composer.
- extendedWaitUntil:
    visible:
      id: chat-composer-input
      text: 'Hello, loom\.'
    timeout: 10000
- assertNotVisible:
    id: chat-message-row-.*
- takeScreenshot: es-04-first-tree

# Ready, no trees yet (the empty first tree was discarded): no setup hint;
# one line says the first message below begins a tree.
- runFlow: ../go-home.yaml
- assertNotVisible:
    id: home-setup-hint
# Left unsent, the draft goes back to Home's composer with the tree discarded.
- extendedWaitUntil:
    visible:
      id: home-composer-input
      text: 'Hello, loom\.'
    timeout: 10000
- takeScreenshot: es-04b-draft-back-on-home
- tapOn:
    id: home-composer-input
- eraseText: 80
- assertNotVisible: 'Hello, loom\.'
- tapOn:
    id: home-greeting
- assertNotVisible:
    id: home-trees-row-.*
- extendedWaitUntil:
    visible:
      id: home-empty-hint
    timeout: 10000
- tapOn:
    id: home-greeting
- waitForAnimationToEnd
- takeScreenshot: es-05-home-no-trees

# One tree on the mock agent, for beta1-lmstudio-down.yaml.
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Tell me about aspen groves.
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
- extendedWaitUntil:
    visible: 'Mock title #\d+'
    timeout: 30000
- runFlow: ../go-home.yaml

# No key: an OpenRouter agent made the default, with no key stored.
- runFlow: ../open-settings.yaml
- tapOn:
    id: settings-link-agents
- tapOn:
    id: settings-agents-new
- tapOn:
    id: agent-editor-template-claude-sonnet-balanced
- tapOn:
    id: agent-editor-submit
- extendedWaitUntil:
    visible:
      id: settings-agents-list
    timeout: 10000
- tapOn: 'Make Default'
- waitForAnimationToEnd
- runFlow: ../go-home.yaml
- extendedWaitUntil:
    visible:
      id: home-setup-hint
    timeout: 10000
- assertVisible: 'Add your OpenRouter key to start a tree.'
- tapOn:
    id: home-greeting
- waitForAnimationToEnd
- takeScreenshot: es-06-home-no-key
- tapOn:
    id: home-setup-action
# The Connections sheet opens on its list: OpenRouter says "No key".
- extendedWaitUntil:
    visible:
      id: connections-row-openrouter
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: es-07-no-key-opens-connections
- tapOn:
    id: connections-row-openrouter
- extendedWaitUntil:
    visible:
      id: connections-openrouter-edit
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: es-07b-no-key-openrouter-screen
