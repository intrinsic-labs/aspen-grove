# First real turn with no API key: a cleared install set up through
# onboarding against the mock server (setup.yaml), then a tree started from
# Home's composer with one message, and the reply streamed to the end.
# Needs the mock server on 1235 and Metro up (see VERIFY.md, "No key?"):
#   maestro test .maestro/mock/first-turn.yaml --test-output-dir "$SHOTS"
appId: com.intrinsiclabs.aspengrove
---
- runFlow: setup.yaml

# P2: back to Home (setup.yaml ends on onboarding's empty first tree, which
# leaving discards) and start a tree from its composer; the tree opens and
# sends the message.
- runFlow: ../go-home.yaml
- takeScreenshot: mock-03-home
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Say hello in five words.
# The streaming row has its own id and goes away when the reply is persisted.
# Wait for it to show first so the wait below can't pass before streaming starts.
- extendedWaitUntil:
    visible:
      id: chat-streaming-message
    timeout: 30000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: chat-streaming-message
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 10000
- takeScreenshot: mock-04-first-reply
