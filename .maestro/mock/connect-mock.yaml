# Point Settings → Connections → LM Studio at the mock server
# (scripts/mock-llm-server, default http://localhost:1235), test the
# connection and create a shared agent on its model. Starts on Home; ends on
# Settings. No key needed.
#   maestro test .maestro/mock/connect-mock.yaml -e MOCK_URL=http://localhost:1235 -e MOCK_MODEL=mock-model
# Needs MOCK_URL and MOCK_MODEL (setup.yaml passes them).
appId: com.intrinsiclabs.aspengrove
---
- runFlow: ../open-settings.yaml
- tapOn:
    id: settings-link-connections
# The LM Studio section sits below the API Keys card.
- scrollUntilVisible:
    element:
      id: connections-lmstudio-test
# A tap leaves the caret mid-text, so select all and type over it.
- tapOn:
    id: connections-lmstudio-endpoint-input
- longPressOn:
    id: connections-lmstudio-endpoint-input
- tapOn:
    text: 'Select All'
    optional: true
- eraseText: 80
- inputText: ${MOCK_URL}
- assertVisible: ${MOCK_URL}
- hideKeyboard
- tapOn:
    id: connections-lmstudio-test
- extendedWaitUntil:
    visible:
      id: connections-lmstudio-status
      text: 'Connected'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: mock-01-connections-connected
# Back to Settings, retrying a tap that lands mid-transition.
- repeat:
    times: 3
    while:
      notVisible:
        id: settings-screen
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: BackButton

# P1 on the mock model.
- tapOn:
    id: settings-link-agents
- tapOn:
    id: settings-agents-new
# Name first, while the field is on screen and before the sheet scrolls.
- tapOn:
    id: agent-editor-name-input
- inputText: Mock
- hideKeyboard
- tapOn:
    id: agent-editor-model-provider-lmstudio
# The model list can run below the sheet's fold: scroll the model up.
- scrollUntilVisible:
    element:
      id: agent-editor-model-option-${MOCK_MODEL}
    centerElement: true
    timeout: 10000
- tapOn:
    id: agent-editor-model-option-${MOCK_MODEL}
- takeScreenshot: mock-02-agent-editor
- tapOn:
    id: agent-editor-submit
- extendedWaitUntil:
    visible:
      id: settings-agents-list
    timeout: 10000
- repeat:
    times: 3
    while:
      notVisible:
        id: settings-screen
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: BackButton
