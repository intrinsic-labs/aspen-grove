# The Beta 1 definition of done, end to end, against the mock server (no key):
# create a tree, pick and configure its agent, converse with branching,
# browse siblings inline, edit as a branch, bookmark, view provenance,
# export, and survive a restart (.dev/BUILD-PLAN.md, Milestone D).
# Needs the mock server and Metro up (see VERIFY.md, "No key?"):
#   maestro test .maestro/mock/beta1-loop.yaml --test-output-dir "$SHOTS/beta1-loop"
# Mock on another port? Add -e MOCK_URL=http://localhost:<port>.
appId: com.intrinsiclabs.aspengrove
---
# Pick and configure an agent: onboarding's LM Studio page, model mock-model.
- runFlow: setup.yaml
- runFlow: ../go-home.yaml

# Create a tree and converse.
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Tell me about aspen groves.
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
- extendedWaitUntil:
    visible: 'Mock title #\d+'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: dod-01-first-reply

# The tree's agent is configurable from its menu (Model Settings).
- runFlow: ../open-tree-menu.yaml
- tapOn: 'Model'
- extendedWaitUntil:
    visible: 'mock-model'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: dod-02-model-settings
- repeat:
    times: 3
    while:
      notVisible:
        id: chat-screen
    commands:
      - waitForAnimationToEnd
      - runFlow: ../go-back.yaml

# Branch: regenerate the reply, which grows a sibling.
- longPressOn:
    id: chat-message-row-.*
    index: 1
- tapOn: 'Regenerate Response'
- extendedWaitUntil:
    visible:
      id: chat-streaming-message
    timeout: 30000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: chat-streaming-message
    timeout: 60000
- waitForAnimationToEnd

# Browse the siblings inline: the human turn's rail shows both replies.
- tapOn:
    id: chat-message-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: 'chat-continuation-card-.*'
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: 'Continuations: 2'
- takeScreenshot: dod-03-siblings-inline
- tapOn:
    id: chat-message-row-.*
    index: 0
- extendedWaitUntil:
    notVisible:
      id: chat-continuation-rail
    timeout: 10000
- waitForAnimationToEnd

# A second turn.
- tapOn:
    id: chat-composer-input
- inputText: How old can they get?
- tapOn:
    id: chat-composer-send
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 3
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: chat-streaming-message
    timeout: 60000
- waitForAnimationToEnd

# Edit as a branch: the edit becomes a new human node beside the original.
- longPressOn:
    id: chat-message-row-.*
    index: 2
- tapOn: 'Edit'
- extendedWaitUntil:
    visible:
      id: chat-composer-edit-banner
    timeout: 10000
- eraseText: 60
- inputText: How big can one grove get?
- takeScreenshot: dod-04-editing
- tapOn:
    id: chat-composer-send
- extendedWaitUntil:
    visible: 'How big can one grove get\?'
    timeout: 15000
- waitForAnimationToEnd
- hideKeyboard
# The reply above it now has two continuations: the original and the edit.
- tapOn:
    id: chat-message-row-.*
    index: 1
- extendedWaitUntil:
    visible:
      id: 'chat-continuation-card-.*'
    timeout: 30000
- waitForAnimationToEnd
- assertVisible: 'Continuations: 2'
- takeScreenshot: dod-05-edited-branch
- tapOn:
    id: chat-message-row-.*
    index: 1
- extendedWaitUntil:
    notVisible:
      id: chat-continuation-rail
    timeout: 10000
- waitForAnimationToEnd

# A reply on the new branch.
- longPressOn:
    id: chat-message-row-.*
    index: 2
- tapOn: 'Regenerate Response'
- extendedWaitUntil:
    visible:
      id: chat-streaming-message
    timeout: 30000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: chat-streaming-message
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 3
    timeout: 15000
- waitForAnimationToEnd

# Bookmark the reply.
- longPressOn:
    id: chat-message-row-.*
    index: 3
- tapOn: 'Bookmark'
- waitForAnimationToEnd

# Provenance: the reply's Node Info verifies its hash chain.
- longPressOn:
    id: chat-message-row-.*
    index: 3
- assertVisible: 'Remove Bookmark'
- tapOn: 'Node Info'
- extendedWaitUntil:
    visible:
      id: node-sheet
    timeout: 10000
- waitForAnimationToEnd
# The Provenance section sits below the text and metadata.
- scrollUntilVisible:
    element: 'Verified.*'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: dod-06-provenance
- tapOn:
    id: node-sheet-back
- extendedWaitUntil:
    notVisible:
      id: node-sheet
    timeout: 10000
- waitForAnimationToEnd

# Export: the Open Loom sheet, then the system share sheet with the file.
- runFlow: ../open-tree-menu.yaml
- tapOn: 'Export to OpenLoom Format'
- extendedWaitUntil:
    visible:
      id: export-sheet
    timeout: 10000
- waitForAnimationToEnd
- assertVisible: 'Include Bookmarks'
- takeScreenshot: dod-07-export-sheet
- tapOn:
    id: export-sheet-share
# Share closes the export sheet first (iOS shows one sheet at a time), then
# exports. The system share sheet must come up with the .openloom file in
# it: a failed export shows `chat-error` and no sheet, and fails here.
- extendedWaitUntil:
    notVisible:
      id: export-sheet
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: ActivityListView
    timeout: 15000
- assertVisible: '.*\.openloom, .*'
- assertVisible: 'Save to Files'
- assertNotVisible:
    id: chat-error
- waitForAnimationToEnd
- takeScreenshot: dod-08-export-share
# Close the share sheet. On iOS 26 it is a popover with no Close button:
# tap outside it (the dismiss region's center is above the sheet). Older
# share sheets have a Close button. Either way it must be gone after.
- repeat:
    times: 3
    while:
      visible:
        id: ActivityListView
    commands:
      - tapOn:
          id: PopoverDismissRegion
          optional: true
      - waitForAnimationToEnd
      - tapOn:
          text: 'Close'
          optional: true
      - waitForAnimationToEnd
- assertNotVisible:
    id: ActivityListView
- assertVisible:
    id: chat-screen
- assertNotVisible:
    id: chat-error

# Survive a restart: the edited branch is current, its reply bookmarked,
# and the original turn kept beside the edit.
- runFlow: ../relaunch-app.yaml
- tapOn:
    id: home-trees-row-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 3
    timeout: 15000
- waitForAnimationToEnd
# The edited branch is current: the path runs through the edit, not the
# original turn.
- assertVisible: 'How big can one grove get\?'
- assertNotVisible: 'How old can they get\?'
- takeScreenshot: dod-09-after-restart
# Its reply is still bookmarked: the reply's own menu offers Remove Bookmark.
- longPressOn:
    id: chat-message-row-.*
    index: 3
- assertVisible: 'Remove Bookmark'
- takeScreenshot: dod-10-after-restart-bookmarked
# Close it with a tap in the header's band, above the lifted reply (kept
# below the header; a tap just under the status bar doesn't reach the menu).
- tapOn:
    point: '50%,12%'
- waitForAnimationToEnd
- assertNotVisible: 'Remove Bookmark'
# The original turn is kept beside the edit: the rail under the reply above
# them opens on the edit, with the check of the active path, and, swiped
# back, holds the original (no longer on the path, so only the rail shows it).
- tapOn:
    id: chat-message-row-.*
    index: 1
- extendedWaitUntil:
    visible:
      id: chat-continuation-rail
    timeout: 30000
- waitForAnimationToEnd
- assertVisible:
    id: chat-continuation-card-check
- takeScreenshot: dod-11-after-restart-edit-current
- swipe:
    from:
      id: chat-continuation-rail-list
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: 'How old can they get\?'
- takeScreenshot: dod-12-after-restart-original-kept
