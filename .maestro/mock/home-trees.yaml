# Home with trees, against the mock server (no key): two trees started from
# Home's composer, the list, the `···` menu, then a rename and a delete by
# swipe. Needs the mock server and Metro up (see VERIFY.md, "No key?"):
#   maestro test .maestro/mock/home-trees.yaml --test-output-dir "$SHOTS"
appId: com.intrinsiclabs.aspengrove
---
- runFlow: setup.yaml
- runFlow: ../go-home.yaml

# Two trees, each from a first message; wait for each reply to land.
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Write me a short story about a lighthouse keeper
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
- takeScreenshot: home-01-tree-from-composer
- runFlow: ../go-home.yaml
- runFlow:
    file: ../start-tree.yaml
    env:
      MESSAGE: Name three rivers that run north
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
- runFlow: ../go-home.yaml
# The mock's reply retitles each tree (auto-title), so count rows instead.
- assertVisible:
    id: home-trees-row-.*
    index: 1
- takeScreenshot: home-02-trees

# The menu.
- runFlow: ../open-home-menu.yaml
- assertVisible: 'OpenLoom Docs'
- assertVisible: 'Search'
- waitForAnimationToEnd
- takeScreenshot: home-03-menu
# Close the menu with a tap on empty space below the list.
- tapOn:
    point: '50%,75%'
- waitForAnimationToEnd

# Swipe right: Edit Name, then rename in the alert.
- swipe:
    from:
      id: home-trees-row-.*
      index: 1
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: home-trees-rename-.*
- takeScreenshot: home-04-swipe-edit
- tapOn:
    id: home-trees-rename-.*
- assertVisible: 'Loom Tree Name'
- eraseText: 60
- inputText: The Lighthouse
- tapOn: Save
# The row reads as one element: "<title>, <date>, ".
- extendedWaitUntil:
    visible: 'The Lighthouse.*'
    timeout: 5000

# Swipe left: Delete.
- swipe:
    from:
      text: 'The Lighthouse.*'
    direction: LEFT
- waitForAnimationToEnd
- takeScreenshot: home-05-swipe-delete
- tapOn:
    text: 'Delete'
- extendedWaitUntil:
    notVisible: 'The Lighthouse.*'
    timeout: 5000
- assertVisible:
    id: home-trees-row-.*
- assertNotVisible:
    id: home-trees-row-.*
    index: 1

# The composer, focused with a draft (left unsent).
- tapOn:
    id: home-composer-input
- inputText: Tell me about the oldest trees on Earth
- takeScreenshot: home-06-composer-text
