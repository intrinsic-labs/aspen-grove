# Quits the app and launches it again keeping its data, through the dev
# launcher to Home: what a restart does to whatever was saved.
# Run from another flow with `- runFlow: relaunch-app.yaml`; takes the same
# METRO_PORT / METRO_URL / RELEASE_BUILD as open-app.yaml.
appId: com.intrinsiclabs.aspengrove
---
- stopApp
- launchApp:
    clearState: false
    stopApp: true
- runFlow:
    when:
      true: ${!RELEASE_BUILD}
    file: connect-metro.yaml
- runFlow:
    when:
      true: ${!!RELEASE_BUILD}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'home-welcome|onboarding-screen'
          timeout: 60000
      - waitForAnimationToEnd
