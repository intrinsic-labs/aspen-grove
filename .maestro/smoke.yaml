# Cold-start smoke walk: onboarding, then skip, then every screen a fresh install can reach
# without a provider key.
# Run from the repo root with the app installed on a booted simulator:
#   maestro test .maestro/smoke.yaml --test-output-dir "$SHOTS"
# Screenshots land in the test output directory. Selectors are the testIDs in FEATURE_MAP.md.
appId: com.intrinsiclabs.aspengrove
---
- launchApp:
    clearState: true
# A fresh install opens onboarding over Home. Capture step 1 with each provider, then skip.
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 30000
- assertVisible:
    id: onboarding-step-provider
- takeScreenshot: 01-onboarding-openrouter
- tapOn:
    id: onboarding-provider-lmstudio
- assertVisible:
    id: connections-lmstudio-endpoint-input
- takeScreenshot: 02-onboarding-lmstudio
- tapOn:
    id: onboarding-provider-openrouter
- tapOn:
    id: onboarding-skip

- extendedWaitUntil:
    visible:
      id: home-welcome
    timeout: 10000
- assertVisible:
    id: home-setup-action
- assertNotVisible:
    id: onboarding-screen
- takeScreenshot: 03-home

- tapOn:
    id: drawer-menu-button
- assertVisible:
    id: drawer-root
- takeScreenshot: 04-drawer

- tapOn:
    id: drawer-nav-trees
- assertVisible:
    id: trees-screen
- assertVisible:
    id: trees-empty
- assertVisible:
    id: trees-setup-action
- takeScreenshot: 05-trees-empty

- tapOn:
    id: drawer-menu-button
- tapOn:
    id: drawer-nav-search
- assertVisible:
    id: search-screen
- takeScreenshot: 06-search

- tapOn:
    id: drawer-menu-button
- tapOn:
    id: drawer-nav-settings
- assertVisible:
    id: settings-screen
- takeScreenshot: 07-settings

- tapOn:
    id: settings-link-connections
- assertVisible:
    id: connections-openrouter-key-input
- assertVisible:
    id: connections-lmstudio-endpoint-input
- takeScreenshot: 08-connections
- back

- tapOn:
    id: settings-link-agents
- assertVisible:
    id: settings-agents-screen
- takeScreenshot: 09-agents-empty
- tapOn:
    id: settings-agents-new
- assertVisible:
    id: agent-editor-sheet
- takeScreenshot: 10-agent-editor
