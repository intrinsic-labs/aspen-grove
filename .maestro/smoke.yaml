# Cold-start smoke walk: onboarding, then skip, then every screen a fresh install can reach
# without a provider key (Home, its menu, Search, Settings, Connections, Agents).
# Run from the repo root with the app installed on a booted simulator:
#   maestro test .maestro/smoke.yaml --test-output-dir "$SHOTS"
# Screenshots land in the test output directory. Selectors are the testIDs in FEATURE_MAP.md.
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-app.yaml
# A fresh install opens onboarding over Home. Capture step 1 with each provider, then skip.
- assertVisible:
    id: onboarding-step-provider
- takeScreenshot: 01-onboarding-openrouter
- tapOn:
    id: onboarding-provider-lmstudio
- assertVisible:
    id: connections-lmstudio-endpoint-input
- takeScreenshot: 02-onboarding-lmstudio
- tapOn:
    id: onboarding-provider-openrouter
- tapOn:
    id: onboarding-skip

- extendedWaitUntil:
    visible:
      id: home-welcome
    timeout: 10000
- assertVisible:
    id: home-setup-action
- assertNotVisible:
    id: onboarding-screen
- takeScreenshot: 03-home

# Home's `···` menu: Latent Spaces' items plus Search.
- runFlow: open-home-menu.yaml
- assertVisible: 'Show Onboarding'
- takeScreenshot: 04-home-menu
- tapOn: Search
- assertVisible:
    id: search-screen
- takeScreenshot: 06-search
- runFlow: go-home.yaml

- runFlow: open-settings.yaml
- takeScreenshot: 07-settings

- tapOn:
    id: settings-link-connections
- assertVisible:
    id: connections-openrouter-edit
- scrollUntilVisible:
    element:
      id: connections-lmstudio-endpoint-input
- takeScreenshot: 08-connections
# The key is entered in a sheet, as in Latent Spaces' API Keys page.
- tapOn:
    id: connections-openrouter-edit
- assertVisible:
    id: connections-openrouter-key-input
- takeScreenshot: 08b-connections-key-sheet
- tapOn:
    id: connections-openrouter-key-cancel
- assertNotVisible:
    id: connections-openrouter-key-input
# `back` is Android-only in Maestro; tap the stack header's back button, and
# retry, since a tap during the push transition can be dropped.
- repeat:
    times: 3
    while:
      notVisible:
        id: settings-screen
    commands:
      - waitForAnimationToEnd
      - tapOn:
          id: BackButton
- assertVisible:
    id: settings-screen

- tapOn:
    id: settings-link-agents
- assertVisible:
    id: settings-agents-screen
- takeScreenshot: 09-agents-empty
- tapOn:
    id: settings-agents-new
- assertVisible:
    id: agent-editor-sheet
- takeScreenshot: 10-agent-editor
