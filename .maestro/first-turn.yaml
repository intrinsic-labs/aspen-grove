# First real turn: create an agent, open a tree, send, see the reply and its provenance.
# Needs a provider: start Metro with EXPO_PUBLIC_OPENROUTER_API_KEY set (see VERIFY.md),
# then run after smoke.yaml or on its own:
#   maestro test .maestro/first-turn.yaml --test-output-dir "$SHOTS"
# It costs one short OpenRouter completion plus one title call.
appId: com.intrinsiclabs.aspengrove
---
- runFlow: open-app.yaml
# A fresh install opens onboarding; skip it and take the Settings path (the P1 path
# through Settings), which works with the EXPO_PUBLIC_ key fallback.
- runFlow: skip-onboarding.yaml

# P1: create an agent from the first template.
- runFlow: open-settings.yaml
- tapOn:
    id: settings-link-agents
- tapOn:
    id: settings-agents-new
- tapOn:
    id: agent-editor-template-claude-sonnet-balanced
- tapOn:
    id: agent-editor-submit
- extendedWaitUntil:
    visible:
      id: settings-agents-list
    timeout: 10000
- takeScreenshot: 11-agent-created

# P2: back to Home and start a tree from its composer; the tree opens and
# sends the message.
- runFlow: go-home.yaml
- takeScreenshot: 12-home
- runFlow:
    file: start-tree.yaml
    env:
      MESSAGE: Say hello in five words.
# The streaming row has its own id; the reply's persisted row (the second
# chat-message-row-*) appears only once streaming completes.
- extendedWaitUntil:
    visible:
      id: chat-message-row-.*
      index: 1
    timeout: 60000
- takeScreenshot: 13-first-reply

# Node Info sheet for the reply: generation details and the provenance check,
# under the text.
- longPressOn:
    id: chat-message-row-.*
    index: 1
- tapOn: Node Info
- extendedWaitUntil:
    visible:
      id: node-sheet-text
    timeout: 10000
- scrollUntilVisible:
    element:
      id: node-sheet-provenance-status
    timeout: 10000
- takeScreenshot: 14-node-sheet
- tapOn:
    id: node-sheet-back
