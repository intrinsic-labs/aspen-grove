# Open Settings from Home with its trailing toolbar button. A tap that lands
# while a transition is still settling can be dropped, so retry until
# Settings shows. Run from another flow with `- runFlow: open-settings.yaml`.
appId: com.intrinsiclabs.aspengrove
---
- waitForAnimationToEnd
# Android pans the window over the keyboard (`softwareKeyboardLayoutMode:
# pan`), so with Home's composer focused the header is off screen: the back
# key puts the keyboard away first.
- runFlow:
    when:
      platform: Android
      notVisible:
        id: home-settings-button
    commands:
      - back
      - waitForAnimationToEnd
- repeat:
    times: 3
    while:
      notVisible:
        id: settings-screen
    commands:
      - tapOn:
          id: home-settings-button
      - waitForAnimationToEnd
- assertVisible:
    id: settings-screen
