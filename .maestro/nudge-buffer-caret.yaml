# Android only, after a tap into a passage: the CodeMirror WebView reports a
# tap's selection without its position, so the pill does not move to the tapped
# passage until a change carries the caret (the native input reported every
# selection). Type a letter and erase it: the text is the saved text again and
# the pill follows the caret. Remove this when taps move the pill on the web
# editor.
appId: com.intrinsiclabs.aspengrove
---
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: 'x'
      - eraseText: 1
      - waitForAnimationToEnd
